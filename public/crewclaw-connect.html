<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect BidClaw jobs</title>
<style>body{font:18px system-ui;color:#12305d;max-width:560px;margin:40px auto;padding:20px}button{font:inherit;padding:12px;background:#134dde;color:white;border:0;border-radius:8px}p{line-height:1.6}</style>
<h1>Send jobs to CrewClaw</h1><p>Allow this CrewClaw window to read your approved and in-progress BidClaw jobs for the next 15 minutes. You will choose the jobs and their company and division in CrewClaw. Estimates and proposals will not be changed.</p><p id="message"></p><button id="connect">Allow job import</button>
<script type="module">
const params=new URLSearchParams(location.search),button=document.querySelector('#connect'),message=document.querySelector('#message');
button.onclick=async()=>{button.disabled=true;try{
 if(!window.opener||!params.get('nonce'))throw Error('Open this page from CrewClaw office setup.');
 const session=JSON.parse(localStorage.getItem('sb-cdjpzvyqvohwmlmquldt-auth-token')||'null');
 if(!session?.access_token)throw Error('Sign in to BidClaw in another tab, then return and try again.');
 const response=await fetch('https://cdjpzvyqvohwmlmquldt.supabase.co/functions/v1/crewclaw-jobs',{method:'POST',headers:{authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({workspaceId:params.get('workspace'),companyId:params.get('company')})});
 const body=await response.json();if(!response.ok)throw Error(body.error);
 window.opener.postMessage({type:'crewclaw-bidclaw',nonce:params.get('nonce'),token:body.token},'https://crewclaw.netlify.app');message.textContent='Connected for this import. Return to CrewClaw to select jobs.';
 }catch(e){message.textContent=e.message;button.disabled=false}};
</script></html>
